<style>:root{--cobalt:#1F4FD6;--cerulean:#4AA3F2;--ink:#0B1C45;--mist:#DCEBFF;--sun:#FFE7A3}
body{margin:0;font-family:'Wanted Sans Variable',sans-serif;background:#fff;color:var(--ink);padding:24px 16px}
h1{font-size:20px}p{max-width:640px}.box{border-radius:14px;padding:40px 24px;margin:16px 0;display:flex;align-items:center;justify-content:center}
.light{background:linear-gradient(#fff,var(--mist))}.dark{background:var(--cobalt)}
.bar{height:64px;background:#fff;border-bottom:1px solid var(--mist);display:flex;align-items:center;padding:0 20px;gap:24px;margin:16px 0}
.bar nav{margin-left:auto;font-size:14px;display:flex;gap:16px}.bar svg{height:28px;width:auto}.box svg{max-width:100%;height:auto}

<a href="index.html">← 비교</a><h1>L2 · Offerfolio</h1><p>역채용을 이름 자체로 선언: 기업의 offer + 구직자의 folio. 굵기 대비(700/400)로 두 주체를 나누고, 아래 두 개의 호(弧)가 가운데서 마주 보며 '양쪽에서 다가옴'을 표현.</p>
